<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Maktabi Agent logo concept 01 — Threshold M</title>
  <desc id="description">A symmetrical gold monoline M shaped like an open architectural threshold on an obsidian field.</desc>
  <defs>
    <g id="threshold-mark">
      <path d="M38 218V62L128 158L218 62V218" fill="none" stroke="#E6A93D" stroke-width="38" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M91 218V176L128 137L165 176V218" fill="#09090B"/>
      <path d="M91 218H165" stroke="#E6A93D" stroke-width="12"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="#09090B"/>
  <path d="M72 82H1128" stroke="#E6A93D" stroke-width="2" opacity="0.55"/>
  <text x="72" y="58" fill="#E6A93D" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">MAKTABI AGENT · CONCEPT 01</text>
  <text x="72" y="135" fill="#FFFFFF" font-family="Manrope, Arial, sans-serif" font-size="52" font-weight="700">Threshold M</text>
  <text x="72" y="170" fill="#A1A1AA" font-family="Manrope, Arial, sans-serif" font-size="18">Direct · architectural · strongest small-size silhouette</text>

  <rect x="72" y="220" width="420" height="420" rx="88" fill="#09090B" stroke="#E6A93D" stroke-width="4"/>
  <g transform="translate(154 302) scale(1.0)">
    <use href="#threshold-mark"/>
  </g>

  <g transform="translate(568 262)">
    <text x="0" y="78" fill="#FFFFFF" font-family="Manrope, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">Maktabi</text>
    <text x="2" y="126" fill="#E6A93D" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="8">AGENT</text>
    <path d="M0 160H472" stroke="#E6A93D" stroke-width="2" opacity="0.65"/>
    <text x="260" y="230" fill="#FFFFFF" font-family="Noto Sans Arabic, Arial, sans-serif" font-size="58" font-weight="700" text-anchor="end" direction="rtl">مكتبي</text>
    <text x="0" y="282" fill="#A1A1AA" font-family="Manrope, Arial, sans-serif" font-size="18">The centre becomes a doorway and a desk.</text>
    <text x="0" y="314" fill="#A1A1AA" font-family="Manrope, Arial, sans-serif" font-size="18">Best candidate for taskbar, tray, and installer use.</text>
  </g>

  <g transform="translate(72 690)">
    <text x="0" y="22" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2">SCALE CHECK</text>
    <g transform="translate(154 0)">
      <rect width="64" height="64" rx="14" fill="#09090B" stroke="#27272A"/>
      <g transform="translate(7 7) scale(.195)"><use href="#threshold-mark"/></g>
      <text x="22" y="84" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">64</text>
    </g>
    <g transform="translate(252 16)">
      <rect width="48" height="48" rx="11" fill="#09090B" stroke="#27272A"/>
      <g transform="translate(5 5) scale(.148)"><use href="#threshold-mark"/></g>
      <text x="15" y="68" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">48</text>
    </g>
    <g transform="translate(334 28)">
      <rect width="32" height="32" rx="7" fill="#09090B" stroke="#27272A"/>
      <g transform="translate(3 3) scale(.102)"><use href="#threshold-mark"/></g>
      <text x="8" y="52" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">32</text>
    </g>
    <g transform="translate(400 36)">
      <rect width="24" height="24" rx="5" fill="#09090B" stroke="#27272A"/>
      <g transform="translate(2 2) scale(.078)"><use href="#threshold-mark"/></g>
      <text x="4" y="44" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">24</text>
    </g>
    <g transform="translate(458 40)">
      <rect width="16" height="16" rx="3" fill="#09090B" stroke="#27272A"/>
      <g transform="translate(1.5 1.5) scale(.051)"><use href="#threshold-mark"/></g>
      <text x="0" y="36" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">16</text>
    </g>
  </g>
</svg>
