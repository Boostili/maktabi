<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Maktabi Agent concept 04 — Geometric Book Workspace</title>
  <desc id="desc">The confirmed professional Obsidian and White logo made from three identical book modules on an exact grid, with one controlled lean, equal center spacing, construction details, and small-size tests.</desc>
  <defs>
    <style>
      .latin { font-family: Manrope, Inter, Arial, sans-serif; }
      .label { font-family: Manrope, Inter, Arial, sans-serif; letter-spacing: 0.12em; }
    </style>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.7"/>
    </pattern>
    <rect id="book" width="18" height="68" rx="2"/>
    <g id="books" fill="#FFFFFF">
      <use href="#book" x="22" y="26" transform="rotate(10 31 60)"/>
      <use href="#book" x="51" y="26"/>
      <use href="#book" x="80" y="26"/>
    </g>
    <g id="icon">
      <rect width="120" height="120" rx="29" fill="#09090B"/>
      <use href="#books"/>
    </g>
    <g id="icon-reversed">
      <rect width="120" height="120" rx="29" fill="#09090B"/>
      <g fill="#FFFFFF">
        <use href="#book" x="22" y="26" transform="rotate(10 31 60)"/>
        <use href="#book" x="51" y="26"/>
        <use href="#book" x="80" y="26"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="800" fill="#F6F5F2"/>

  <text x="56" y="66" class="label" font-size="14" font-weight="700" fill="#09090B">MAKTABI AGENT · CONCEPT 04</text>
  <text x="56" y="108" class="latin" font-size="34" font-weight="760" fill="#09090B">Geometric Book / Workspace</text>
  <text x="1144" y="70" text-anchor="end" class="latin" font-size="15" font-weight="700" fill="#09090B">CONFIRMED · 2026-09-24</text>

  <rect x="48" y="142" width="1104" height="318" rx="30" fill="#151517"/>
  <g transform="translate(108 214) scale(1.46)">
    <use href="#icon"/>
  </g>
  <text x="326" y="318" class="latin" font-size="92" font-weight="800" letter-spacing="-3.5" fill="#FFFFFF">Maktabi</text>
  <text x="331" y="365" class="label" font-size="18" font-weight="700" fill="#FFFFFF">AGENT</text>
  <text x="1074" y="382" text-anchor="end" class="latin" font-size="16" font-weight="560" fill="#A9A5AD">organized work · professional clarity</text>

  <rect x="48" y="494" width="518" height="250" rx="24" fill="#FFFFFF" stroke="#DEDCE0"/>
  <text x="76" y="530" class="label" font-size="13" font-weight="700" fill="#67636D">CONSTRUCTION SYSTEM</text>
  <g transform="translate(76 548) scale(1.42)">
    <rect width="120" height="120" rx="29" fill="#09090B"/>
    <rect width="120" height="120" rx="29" fill="url(#grid)"/>
    <use href="#books"/>
    <line x1="31" y1="16" x2="31" y2="104" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.7" stroke-dasharray="2 2"/>
    <line x1="60" y1="16" x2="60" y2="104" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.7" stroke-dasharray="2 2"/>
    <line x1="89" y1="16" x2="89" y2="104" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.7" stroke-dasharray="2 2"/>
  </g>
  <text x="276" y="580" class="latin" font-size="17" font-weight="750" fill="#09090B">One module, repeated three times</text>
  <text x="276" y="614" class="latin" font-size="14" font-weight="580" fill="#67636D">Book module</text>
  <text x="520" y="614" text-anchor="end" class="latin" font-size="14" font-weight="700" fill="#09090B">18 × 68 units</text>
  <line x1="276" y1="627" x2="520" y2="627" stroke="#E5E2E7"/>
  <text x="276" y="649" class="latin" font-size="14" font-weight="580" fill="#67636D">Center rhythm</text>
  <text x="520" y="649" text-anchor="end" class="latin" font-size="14" font-weight="700" fill="#09090B">29 units</text>
  <line x1="276" y1="662" x2="520" y2="662" stroke="#E5E2E7"/>
  <text x="276" y="684" class="latin" font-size="14" font-weight="580" fill="#67636D">Intentional lean</text>
  <text x="520" y="684" text-anchor="end" class="latin" font-size="14" font-weight="700" fill="#09090B">10°</text>
  <text x="276" y="716" class="latin" font-size="12.5" font-weight="560" fill="#8A858E">No module is stretched or hand-spaced.</text>

  <rect x="590" y="494" width="562" height="250" rx="24" fill="#151517"/>
  <text x="618" y="530" class="label" font-size="13" font-weight="700" fill="#B4AFB8">WINDOWS SCALE CHECK</text>
  <g transform="translate(620 558)"><use href="#icon"/></g>
  <g transform="translate(768 586) scale(.5333)"><use href="#icon"/></g>
  <g transform="translate(866 602) scale(.2667)"><use href="#icon"/></g>
  <g transform="translate(928 606) scale(.2)"><use href="#icon"/></g>
  <g transform="translate(980 610) scale(.1333)"><use href="#icon"/></g>
  <text x="680" y="704" text-anchor="middle" class="latin" font-size="13" font-weight="700" fill="#FFFFFF">120</text>
  <text x="800" y="674" text-anchor="middle" class="latin" font-size="13" font-weight="700" fill="#FFFFFF">64</text>
  <text x="882" y="654" text-anchor="middle" class="latin" font-size="13" font-weight="700" fill="#FFFFFF">32</text>
  <text x="940" y="650" text-anchor="middle" class="latin" font-size="13" font-weight="700" fill="#FFFFFF">24</text>
  <text x="988" y="646" text-anchor="middle" class="latin" font-size="13" font-weight="700" fill="#FFFFFF">16</text>
  <g transform="translate(1040 580) scale(.62)"><use href="#icon-reversed"/></g>
  <text x="1077" y="674" text-anchor="middle" class="latin" font-size="12" font-weight="650" fill="#B4AFB8">primary</text>

  <text x="56" y="776" class="latin" font-size="13" font-weight="560" fill="#7C7781">Approved palette · flat vector · exact repetition · live wordmark pending outline conversion</text>
  <text x="1144" y="776" text-anchor="end" class="latin" font-size="13" font-weight="700" fill="#09090B">OBSIDIAN #09090B · WHITE #FFFFFF</text>
</svg>
