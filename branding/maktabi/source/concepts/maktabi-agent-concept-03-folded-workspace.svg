<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Maktabi Agent logo concept 03 — Folded Workspace</title>
  <desc id="description">Two mirrored gold planes fold inward to create an M and a central route on an obsidian field.</desc>
  <defs>
    <g id="folded-mark">
      <path d="M26 218V44H79L128 116V183L78 116V218Z" fill="#E6A93D"/>
      <path d="M230 218V44H177L128 116V183L178 116V218Z" fill="#E6A93D"/>
      <path d="M98 218L128 178L158 218Z" fill="#E6A93D"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="#09090B"/>
  <path d="M72 82H1128" stroke="#E6A93D" stroke-width="2" opacity="0.55"/>
  <text x="72" y="58" fill="#E6A93D" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">MAKTABI AGENT · CONCEPT 03</text>
  <text x="72" y="135" fill="#FFFFFF" font-family="Manrope, Arial, sans-serif" font-size="52" font-weight="700">Folded Workspace</text>
  <text x="72" y="170" fill="#A1A1AA" font-family="Manrope, Arial, sans-serif" font-size="18">Digital · directional · symmetric movement toward the work</text>

  <rect x="72" y="220" width="420" height="420" rx="88" fill="#09090B" stroke="#27272A" stroke-width="3"/>
  <path d="M92 580L472 260" stroke="#E6A93D" stroke-width="2" opacity="0.2"/>
  <path d="M92 280L472 600" stroke="#E6A93D" stroke-width="2" opacity="0.2"/>
  <g transform="translate(154 304)">
    <use href="#folded-mark"/>
  </g>

  <g transform="translate(568 262)">
    <text x="0" y="78" fill="#FFFFFF" font-family="Manrope, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">Maktabi</text>
    <text x="2" y="128" fill="#E6A93D" font-family="Manrope, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="10">AGENT</text>
    <path d="M0 162L236 190L472 162" fill="none" stroke="#E6A93D" stroke-width="2" opacity="0.65"/>
    <text x="260" y="250" fill="#FFFFFF" font-family="Noto Sans Arabic, Arial, sans-serif" font-size="58" font-weight="700" text-anchor="end" direction="rtl">مكتبي</text>
    <text x="0" y="302" fill="#A1A1AA" font-family="Manrope, Arial, sans-serif" font-size="18">Mirrored planes suggest routing, focus, and agency.</text>
    <text x="0" y="334" fill="#A1A1AA" font-family="Manrope, Arial, sans-serif" font-size="18">The most energetic direction for a digital product.</text>
  </g>

  <g transform="translate(72 690)">
    <text x="0" y="22" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2">SCALE CHECK</text>
    <g transform="translate(154 0)"><rect width="64" height="64" rx="14" fill="#09090B" stroke="#27272A"/><g transform="translate(7 7) scale(.195)"><use href="#folded-mark"/></g><text x="22" y="84" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">64</text></g>
    <g transform="translate(252 16)"><rect width="48" height="48" rx="11" fill="#09090B" stroke="#27272A"/><g transform="translate(5 5) scale(.148)"><use href="#folded-mark"/></g><text x="15" y="68" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">48</text></g>
    <g transform="translate(334 28)"><rect width="32" height="32" rx="7" fill="#09090B" stroke="#27272A"/><g transform="translate(3 3) scale(.102)"><use href="#folded-mark"/></g><text x="8" y="52" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">32</text></g>
    <g transform="translate(400 36)"><rect width="24" height="24" rx="5" fill="#09090B" stroke="#27272A"/><g transform="translate(2 2) scale(.078)"><use href="#folded-mark"/></g><text x="4" y="44" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">24</text></g>
    <g transform="translate(458 40)"><rect width="16" height="16" rx="3" fill="#09090B" stroke="#27272A"/><g transform="translate(1.5 1.5) scale(.051)"><use href="#folded-mark"/></g><text x="0" y="36" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">16</text></g>
  </g>
</svg>
