    <g transform="translate(252 16)"><rect width="48" height="48" rx="11" fill="#09090B" stroke="#27272A"/><g transform="translate(5 5) scale(.148)"><use href="#courtyard-mark"/></g><text x="15" y="68" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">48</text></g>
    <g transform="translate(334 28)"><rect width="32" height="32" rx="7" fill="#09090B" stroke="#27272A"/><g transform="translate(3 3) scale(.102)"><use href="#courtyard-mark"/></g><text x="8" y="52" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">32</text></g>
    <g transform="translate(400 36)"><rect width="24" height="24" rx="5" fill="#09090B" stroke="#27272A"/><g transform="translate(2 2) scale(.078)"><use href="#courtyard-mark"/></g><text x="4" y="44" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">24</text></g>
    <g transform="translate(458 40)"><rect width="16" height="16" rx="3" fill="#09090B" stroke="#27272A"/><g transform="translate(1.5 1.5) scale(.051)"><use href="#courtyard-mark"/></g><text x="0" y="36" fill="#71717A" font-family="Manrope, Arial, sans-serif" font-size="12">16</text></g>
