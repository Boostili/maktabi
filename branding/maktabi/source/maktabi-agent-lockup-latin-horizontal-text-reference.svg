<svg xmlns="http://www.w3.org/2000/svg" width="448" height="120" viewBox="0 0 448 120" role="img" aria-labelledby="title desc">
  <title id="title">Maktabi Agent Latin horizontal lockup — editable text reference</title>
  <desc id="desc">Review-only construction reference using Manrope ExtraBold for Maktabi and Manrope Bold with 0.12em tracking for AGENT.</desc>
  <g id="maktabi-agent-mark">
    <rect width="120" height="120" rx="29" fill="#09090B"/>
    <g fill="#FFFFFF">
      <rect x="22" y="26" width="18" height="68" rx="2" transform="rotate(10 31 60)"/>
      <rect x="51" y="26" width="18" height="68" rx="2"/>
      <rect x="80" y="26" width="18" height="68" rx="2"/>
    </g>
  </g>
  <g fill="#09090B">
    <text x="146" y="76" font-family="Manrope, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="0">Maktabi</text>
    <text x="150" y="106" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2.5">AGENT</text>
  </g>
</svg>
