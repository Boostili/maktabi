<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Maktabi Agent usage rules proof board</title>
  <desc id="desc">Clear-space, minimum-size, background, one-color, and incorrect-usage examples for the Maktabi symbol.</desc>
  <defs>
    <g id="primary">
      <rect width="120" height="120" rx="29" fill="#09090B"/>
      <g fill="#FFFFFF"><rect x="22" y="26" width="18" height="68" rx="2" transform="rotate(10 31 60)"/><rect x="51" y="26" width="18" height="68" rx="2"/><rect x="80" y="26" width="18" height="68" rx="2"/></g>
    </g>
  </defs>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="40" y="40" fill="#09090B" font-family="Arial, sans-serif" font-size="18" letter-spacing="1.6">CORRECT USE · PRIMARY MARK, CLEAR SPACE, SCALE, AND VARIANTS</text>
  <rect x="40" y="70" width="240" height="200" fill="#F4F4F5"/>
  <rect x="100" y="110" width="120" height="120" fill="none" stroke="#A1A1AA" stroke-dasharray="5 5"/>
  <use href="#primary" x="100" y="110"/>
  <text x="56" y="254" fill="#71717A" font-family="Arial, sans-serif" font-size="14">1x clear space = 18 units</text>
  <rect x="320" y="70" width="240" height="200" fill="#09090B"/>
  <use href="#primary" x="380" y="110"/>
  <text x="336" y="254" fill="#A1A1AA" font-family="Arial, sans-serif" font-size="14">Use external separation on pure black</text>
  <rect x="600" y="70" width="240" height="200" fill="#09090B"/>
  <g transform="translate(640 110) scale(.5)"><use href="#primary"/></g>
  <g transform="translate(760 110) scale(.5)"><rect width="120" height="120" rx="29" fill="#FFFFFF"/><g fill="#09090B"><rect x="22" y="26" width="18" height="68" rx="2" transform="rotate(10 31 60)"/><rect x="51" y="26" width="18" height="68" rx="2"/><rect x="80" y="26" width="18" height="68" rx="2"/></g></g>
  <text x="616" y="254" fill="#A1A1AA" font-family="Arial, sans-serif" font-size="14">One-color dark / light</text>
  <text x="40" y="330" fill="#71717A" font-family="Arial, sans-serif" font-size="18" letter-spacing="1.6">INCORRECT USE · NEVER DISTRIBUTE</text>
  <g transform="translate(80 370) rotate(-18 60 60) scale(1.2)"><use href="#primary"/></g><text x="72" y="550" fill="#B91C1C" font-family="Arial, sans-serif" font-size="16">Distortion / arbitrary rotation</text>
  <g transform="translate(360 370)"><rect width="120" height="120" rx="29" fill="#7C3AED"/><g fill="#F59E0B"><rect x="22" y="26" width="18" height="68" rx="2" transform="rotate(10 31 60)"/><rect x="51" y="26" width="18" height="68" rx="2"/><rect x="80" y="26" width="18" height="68" rx="2"/></g></g><text x="338" y="550" fill="#B91C1C" font-family="Arial, sans-serif" font-size="16">Recoloring / gradients</text>
  <g transform="translate(650 370) scale(-1 1) translate(-120 0)"><use href="#primary"/></g><text x="676" y="550" fill="#B91C1C" font-family="Arial, sans-serif" font-size="16">Mirroring</text>
  <g transform="translate(900 370)"><rect width="120" height="120" rx="29" fill="#09090B"/><g fill="#FFFFFF"><rect x="28" y="26" width="14" height="68" rx="2"/><rect x="57" y="26" width="22" height="68" rx="2"/><rect x="85" y="26" width="12" height="68" rx="2"/></g></g><text x="874" y="550" fill="#B91C1C" font-family="Arial, sans-serif" font-size="16">Redrawing / rearrangement</text>
  <text x="40" y="690" fill="#71717A" font-family="Arial, sans-serif" font-size="16">Symbol-only below lockup minimum · never add strokes, shadows, badges, flags, or extra colors.</text>
</svg>
